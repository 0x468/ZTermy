function terminal(p){return `<div class="session"><b>● gateway</b><span>SSH · root@192.0.2.12</span><span>已连接 00:42　⌁ 12 ms</span></div><div class="workspace"><div class="terminals"><div class="terminal" data-region="background"><span style="color:${p.ansi[4]}">root@gateway</span> <span class="hint">~/services</span>\n<span style="color:${p.ansi[2]}">❯</span> systemctl status gateway\n<span style="color:${p.ansi[2]}">●</span> gateway.service — Local gateway\n  Loaded: loaded; enabled\n  Active: <span style="color:${p.ansi[2]}">active (running)</span> since 09:41\n\n<span style="color:${p.ansi[4]}">root@gateway</span> <span class="hint">~/services</span>\n<span style="color:${p.ansi[2]}">❯</span> ls -lah\n<span style="color:${p.ansi[4]}">config/   logs/   scripts/</span>   compose.yaml\n<span class="selection">gateway is ready on port 8080</span>\n\n<span class="hint"># 中文路径 / 项目 / 网关 · UTF-8</span></div><div class="terminal secondary" data-region="background"><span class="hint">PowerShell 7 · 本地终端</span>\n<span style="color:${p.ansi[3]}">warning:</span> sample latency threshold exceeded\n<span style="color:${p.ansi[1]}">error:</span> example connection refused\n<span style="color:#E67EB4">truecolor #E67EB4</span> <span class="hint">不会随 ANSI 主题替换</span>\nPS C:\\Projects&gt; <span class="cursor"></span></div></div><aside class="side" data-region="panel"><div class="side-head">▱　↶　▤　◇ <span>×</span></div><h3>远程文件</h3><div class="path">/root/services</div><div class="file"><span>▱</span>config</div><div class="file"><span>▱</span>logs</div><div class="file"><span>▱</span>scripts</div><div class="file chosen"><span>≡</span>compose.yaml</div><div class="file"><span>≡</span>README.md</div><h3 style="margin-top:34px">会话信息</h3><div class="file">Debian GNU/Linux</div><div class="file">CPU　2.4%　 内存　186 MB</div></aside></div>`;}
function settings(){return `<div class="content-scene"><nav class="nav" data-region="panel"><div>常规</div><div class="chosen">外观</div><div>终端</div><div>快捷键</div><div>SFTP</div><div>安全</div><div>关于</div></nav><div class="settings" data-region="content"><h3>外观</h3><p>一套颜色，贯穿每个工作区域。</p><div class="card" data-region="card"><div class="card-title">界面与终端</div><div class="row"><span>当前主题</span><span class="field" data-region="field">${esc(selected.name)}　⌄</span></div><div class="row"><span>强调色</span><span class="field">${$('accentMode').value==='brand'?'ztermy 紫色':'跟随终端主题'}　⌄</span></div><div class="row"><span>背景材质</span><span class="field">纯色 · 颜色校样　⌄</span></div></div><div class="feedback"><button>普通</button><button class="hover-sample">悬停</button><button class="press-sample">按下</button><button class="focus-sample">键盘焦点</button><button disabled class="disabled-sample">禁用</button></div><div class="feedback" style="justify-content:flex-end"><button>放弃更改</button><button class="primary">应用</button></div></div></div>`;}
function overlay(){return `<div class="floating-scene" data-region="content"><div class="underlay">主机 / 最近连接<br><br>gateway　192.0.2.12<br><br>development　192.0.2.18</div><div class="dialog" data-region="floating"><h3>切换工作区</h3><p>浮层沿用同一色调，通过亮度与阴影区分层次。</p><div class="menu-row chosen">▣　开发环境 <span style="float:right;color:var(--muted)">Ctrl + 1</span></div><div class="menu-row">▣　生产网关</div><div class="menu-row">▣　本地工具</div><div class="feedback" style="justify-content:flex-end"><button>取消</button><button class="primary">打开工作区</button></div></div></div>`;}
function frame(old){const t=tokens(selected,old);return `<div><div class="frame-label"><span>${old?'当前配色规则':'候选 · 全界面协调'}</span><span>${selected.dark?'深色':'浅色'} / ${esc(selected.name)}</span></div><div class="window" data-old="${old}" style="${Object.entries(t).map(([k,v])=>'--'+k+':'+v).join(';')}"><div class="titlebar" data-region="chrome"><span class="brand">Z</span><span class="tab">▱</span><span class="tab active"><i class="dot"></i> ${scene==='terminal'?'gateway':scene==='settings'?'设置':'工作台'}　×</span><span class="tab">⌘</span><span>＋</span><span class="spacer"></span><span class="window-tools">⌕ ⚙ − □ ×</span></div>${scene==='terminal'?terminal(selected):scene==='settings'?settings():overlay()}<div class="statusbar"><span>ztermy · ${old?'当前搭配':'主题候选'}</span><span>UTF-8　 /　 Windows</span></div></div></div>`;}
function renderPreview(){const t=tokens(selected);$('name').textContent=selected.name;$('description').textContent=selected.dark?'降低蓝灰割裂，保留终端原色；让操作浮现，让内容安静。':'保持纸面般的清晰层次，减少冷灰边框与大面积纯白的反差。';$('stage').className='stage'+(compare?' compare':'');$('stage').innerHTML=(compare?frame(true):'')+frame(false);$('tokens').innerHTML=Object.entries(regionNames).map(([key,label])=>`<label class="token"><input type="color" aria-label="${label}" data-token="${key}" value="${t[key]}"><span>${label}<code>${t[key].toUpperCase()}</code></span></label>`).join('');$('contrast').innerHTML=[['正文',t.text,t.content],['次要文字',t.muted,t.panel],['按钮',t.accentText,t.accent],['终端',t.foreground,t.background]].map(([n,a,b])=>`<span>${n} <b>${ratio(a,b).toFixed(1)}:1</b> ${ratio(a,b)>=4.5?'✓':'需留意'}</span>`).join('');document.querySelectorAll('[data-theme]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.theme===chosenId()));document.querySelectorAll('[data-scene]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.scene===scene));$('compare').setAttribute('aria-pressed',compare);$('note').value=notes[selected.id]||'';}
$('scenes').onclick=e=>{if(e.target.dataset.scene){scene=e.target.dataset.scene;render();}};$('compare').onclick=()=>{compare=!compare;render();};$('accentMode').onchange=()=>{draft.accentMode=$('accentMode').value;render();};$('reset').onclick=()=>{delete overrides[selected.id];render();};$('tokens').oninput=e=>{if(e.target.dataset.token){(overrides[selected.id]??={})[e.target.dataset.token]=e.target.value;const token=e.target.dataset.token;const v=e.target.value;document.querySelectorAll('.window[data-old="false"]').forEach(w=>{const t=tokens(selected);Object.entries(t).forEach(([k,val])=>w.style.setProperty('--'+k,val));});e.target.nextElementSibling.querySelector('code').textContent=v.toUpperCase();}};$('tokens').onchange=()=>render();$('note').oninput=e=>notes[selected.id]=e.target.value;
$('stage').onclick=e=>{const region=e.target.closest('[data-region]');if(!region||region.closest('[data-old="true"]'))return;document.querySelectorAll('.selected-region').forEach(x=>x.classList.remove('selected-region'));region.classList.add('selected-region');$('region').textContent=regionNames[region.dataset.region];document.querySelector(`[data-token="${region.dataset.region}"]`)?.focus();};
function download(data,name){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);$('message').textContent='已导出 '+name;}
function terminalData(){const t=tokens(selected),keys=['black','red','green','yellow','blue','magenta','cyan','white','brightBlack','brightRed','brightGreen','brightYellow','brightBlue','brightMagenta','brightCyan','brightWhite'];return {version:1,id:selected.id+'-fitting',name:selected.name+' · Fitting',dark:selected.dark,background:t.background,foreground:t.foreground,cursor:t.cursor,selectionBackground:t.selection,selectionForeground:t.selectionText,accent:t.accent,ansi:Object.fromEntries(keys.map((k,i)=>[k,selected.ansi[i]]))};}
$('exportTerminal').onclick=()=>download(terminalData(),selected.id+'-terminal.json');
